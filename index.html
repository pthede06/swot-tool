<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SWOT-Analyse Tool</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="page-header">
    <div id="analysis-heading" class="analysis-heading"></div>
    <div class="title-row">
      <h1>SWOT-Analyse</h1>
      <span class="separator">·</span>
      <div class="analysis-name-wrap">
        <input
          id="analysis-name"
          type="text"
          placeholder="Analyse benennen…"
          aria-label="Name der Analyse"
          maxlength="80"
          autocomplete="off"
          spellcheck="false"
        />
      </div>
    </div>
  </header>

  <div class="swot-grid" id="swot-grid"></div>
  <div class="result-panel" id="result-panel"></div>

  <script src="app.js"></script>
</body>
</html>
